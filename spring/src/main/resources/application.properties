spring.config.import=optional:file:.env[.properties]
spring.application.name=policysim
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=40


# File DB Configuration
# spring.datasource.url=${H2_DB_URL}
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=${H2_DB_USERNAME}
# spring.datasource.password=${H2_DB_PASSWORD}
# spring.jpa.hibernate.ddl-auto=create

# PostgreSQL Configuration (Will be used after PostgreSQL server is set up)
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate

# Flyway defaults
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Redis configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Enable caching
spring.cache.type=redis

# H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Spring security
spring.security.user.name=${SPRING_SECURITY_USERNAME}
spring.security.user.password=${SPRING_SECURITY_PASSWORD}

# Application configuration
contracts.secret=${CONTRACTS_SECRET}

