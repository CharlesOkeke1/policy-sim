buildscript {
    dependencies {
        classpath 'org.flywaydb:flyway-database-postgresql:12.4.0'
    }
}

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.flywaydb.flyway' version '12.4.0'
}

description = 'PolicySim server'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    // Shared message records (delete this line if you skip the contracts module)
    implementation project(':contracts')

    // Web API
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'

    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Database and ORM
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'

    // compileOnly 'org.projectlombok:lombok'
    // annotationProcessor 'org.projectlombok:lombok'

    // Authentication and password hashing
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Swagger UI for API documentation
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'

    // Development
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Redis for caching
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-cache'

    // Mail trap
    implementation 'io.mailtrap:mailtrap-java:1.10.0'

    // Dotenv
    implementation 'io.github.cdimascio:dotenv-java:3.2.0'

    // Flyway DB Migration
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'it.ozimov:embedded-redis:0.7.3'

    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}


flyway {
    url = 'jdbc:postgresql://postgres-db:5432/policysimdb'
    user = 'postgres'
    password = 'admin98fhb3Password'
    schemas = ['public']
}

tasks.named('test') {
    useJUnitPlatform()
}