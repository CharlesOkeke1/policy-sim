services:
  # 1. Database Layer (PostgreSQL)
  postgres-db:
   image: postgres:16-alpine
   container_name: policy_db
   environment:
     POSTGRES_USER: postgres
     POSTGRES_PASSWORD: admin98fhb3Password
     POSTGRES_DB: policysimdb
   ports:
     - "5432:5432"
   volumes:
     - pgdata:/var/lib/postgresql/data
   restart: always

  # 2. Java Spring Boot API Container
  spring-backend:
    image: eclipse-temurin:25-jdk-alpine
    container_name: policy_spring
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    working_dir: /app
    command: sh -c "echo 'Spring Boot workspace ready. Awaiting build artifact...' && tail -f /dev/null"
    #depends_on:
    #  - postgres-db
    restart: always

  # 3. Pure Java Simulation Engine Container
  simulation-engine:
    image: eclipse-temurin:25-jdk-alpine
    container_name: policy_engine
    ports:
      - "8081:8081"
    volumes:
      - .:/app
    working_dir: /app
    command: sh -c "echo 'op ready...' && tail -f /dev/null"
    restart: always
    extra_hosts:
      - "host.docker.internal:172.18.0.1"
    depends_on:
      redis-engine:
        condition: service_healthy

  # 4. React Frontend Workspace Container
  frontend-ui:
    image: node:24-alpine
    container_name: policy_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
    working_dir: /app/frontend
    command: sh -c "echo 'React Frontend workspace ready.' && tail -f /dev/null"
    restart: always

  redis-engine:
    image: redis:7-alpine
    container_name: policy_engine_redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "admin_redis_18_6380_Password"
    volumes:
      - engine_redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - -a
        - "admin_redis_18_6380_Password"
        - ping
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  engine_redis_data:
