$kind: http-request
name: Get Game Rounds
order: 6000
method: GET
url: '{{base_url}}/api/games/{{game_id}}/rounds'
headers:
  - key: Authorization
    value: 'Bearer {{auth_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Rounds returned (200)", () => pm.response.to.have.status(200));
