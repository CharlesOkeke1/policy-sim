$kind: http-request
name: Get Game
order: 3000
method: GET
url: '{{base_url}}/api/games/{{game_id}}'
headers:
  - key: Authorization
    value: 'Bearer {{auth_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Get game (200)", () => pm.response.to.have.status(200));
      pm.test("Game data present", () => {
        const json = pm.response.json();
        pm.expect(json.data).to.be.an("object");
      });
