$kind: http-example
request:
  url: http://localhost:8080/api/users
  method: POST
  body:
    type: json
    content: "{\r

      \    \"username\": \"{{username}}\",\r

      \    \"email\": \"{{email}}\",\r

      \    \"password\": \"{{password}}\"\r

      }"
response:
  statusCode: 201
  statusText: ""
  headers:
    - key: Vary
      value: Origin
    - key: Vary
      value: Access-Control-Request-Method
    - key: Vary
      value: Access-Control-Request-Headers
    - key: Location
      value: /api/users/25
    - key: X-Content-Type-Options
      value: nosniff
    - key: X-XSS-Protection
      value: "0"
    - key: Cache-Control
      value: no-cache, no-store, max-age=0, must-revalidate
    - key: Pragma
      value: no-cache
    - key: Expires
      value: "0"
    - key: X-Frame-Options
      value: DENY
    - key: Content-Type
      value: application/json
    - key: Transfer-Encoding
      value: chunked
    - key: Date
      value: Fri, 30 Oct 2026 17:37:55 GMT
    - key: Keep-Alive
      value: timeout=60
    - key: Connection
      value: keep-alive
  body:
    type: json
    content: |-
      {
        "code": 201,
        "message": "success",
        "error": null,
        "result": {
          "id": 25,
          "email": "bot250@charlesokeke.com",
          "name": "bot250",
          "authToken": null
        }
      }
order: 1000
